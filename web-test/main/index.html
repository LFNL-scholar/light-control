<header><div class="brand-lockup"><svg class="brand-logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>一盏 · 长条台灯</title>

</svg><div class="brand">一盏<span style="color:#8b967b">.</span><small>YOUR EVERYDAY LIGHT</small></div></div><div class="connection"><i class="dot" id="dot"></i><span id="connection">正在连接设备</span></div></header>
<main class="layout"><section class="scene-wrap"><canvas id="scene" aria-label="白色夹子台灯、黑色桌面和米白色墙面的三维预览"></canvas><div class="scene-label"><span class="pill">LOCAL · 3D PREVIEW</span><h1>为专注，留一束光。</h1><p>80cm 夹子灯 · 黑色桌面 / 米白墙面</p></div><div id="render-error" role="status"></div><div class="scene-tools"><span>拖动旋转视角 · 滚轮或双指缩放</span><button id="reset-view">↺ 恢复视角</button></div></section>
<section class="controls"><article class="card"><div class="card-heading"><span>灯光电源</span><span>POWER</span></div><div class="power-line"><div class="power-copy"><strong id="power">等待连接</strong><small>一点亮起，一刻安静。</small></div><button id="power-toggle" class="switch" role="switch" aria-label="模拟灯光电源" aria-checked="false" disabled><i></i></button></div></article>
<article class="card"><div class="card-heading"><span>亮度</span><span>BRIGHTNESS</span></div><div class="value"><span id="brightness">—</span><small>%</small></div><div class="adjust"><button data-action="dimmer" aria-label="调暗" disabled>−</button><div class="track"><span id="brightness-track" style="width:0"></span></div><button data-action="brighter" aria-label="调亮" disabled>+</button></div><div class="ends"><span>柔和</span><span>明亮</span></div></article>

<div class="footer"><button class="reading" data-action="reading" disabled>▤ &nbsp; 阅读场景</button><div class="message" id="message" role="status" aria-live="polite">等待 ESP32 返回状态…</div></div><div class="note">模拟预览 · 控件已连接 ESP32，尚未控制实物台灯。亮度、色温与阅读场景为演示值。3D 资源全部本地加载，无需外网。</div></main>
